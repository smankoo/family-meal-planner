<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Light gray background -->
  <rect width="1200" height="630" fill="#f4f4f5"/>

  <!-- Rounded black square -->
  <rect x="520" y="100" width="160" height="160" rx="36" fill="#18181b"/>

  <!-- Chef hat icon -->
  <g transform="translate(600, 180)">
    <!-- Hat top cloud shape -->
    <path d="M-28 8 C-40 8 -48 -4 -40 -16 C-36 -24 -24 -28 -12 -28 L12 -28 C24 -28 36 -24 40 -16 C48 -4 40 8 28 8"
          fill="none" stroke="white" stroke-width="4" stroke-linecap="round"/>
    <!-- Hat band/base -->
    <path d="M-28 8 L-28 24 C-28 28 -24 32 -20 32 L20 32 C24 32 28 28 28 24 L28 8"
          fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text: Meal Planner -->
  <text x="600" y="350" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="72" font-weight="700" fill="#18181b" text-anchor="middle">Meal Planner</text>

  <!-- Tagline -->
  <text x="600" y="420" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="32" fill="#71717a" text-anchor="middle">AI-powered family meal planning assistant</text>
</svg>
