[project]
name = "family-meal-planner-backend"
version = "0.1.0"
description = "Backend API for Family Meal Planner"
authors = [
    {name = "Family Meal Planner Team"}
]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "google-genai>=1.51.0",
    "google-api-core>=2.0.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.46",
    "alembic>=1.18.1",
    "psycopg2-binary>=2.9.11",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.22",
    "email-validator>=2.3.0",
    "supabase>=2.0.0",
    "pyjwt>=2.8.0",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []

[project.scripts]
start = "main:app"
