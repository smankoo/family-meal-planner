[project]
name = "family-meal-planner-backend"
version = "0.1.0"
description = "Backend API for Family Meal Planner"
authors = [
    {name = "Family Meal Planner Team"}
]
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "google-genai>=1.51.0",
    "python-dotenv>=1.0.1",
]
requires-python = ">=3.11"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
dev-dependencies = []

[project.scripts]
start = "main:app"
