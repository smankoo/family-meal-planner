<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Family Meal Planner</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }

      /* Enhanced backdrop blur support for Apple-like frosted glass effect */
      .backdrop-blur-xl {
        -webkit-backdrop-filter: blur(20px);
        backdrop-filter: blur(20px);
      }

      .backdrop-blur-sm {
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
      }

      /* Ensure proper layering and performance */
      .frosted-header {
        transform: translateZ(0);
        will-change: transform;
      }

      /* Prevent mobile zoom on input focus */
      input, textarea, select {
        font-size: 16px !important;
        -webkit-appearance: none;
        -webkit-border-radius: 0;
        border-radius: 0;
      }

      /* Ensure inputs maintain their designed appearance while preventing zoom */
      input[type="text"],
      input[type="number"],
      input[type="email"],
      input[type="password"],
      textarea {
        font-size: 16px !important;
        transform: scale(1);
        -webkit-text-size-adjust: 100%;
      }

      /* Maintain visual hierarchy while preventing zoom */
      @media (max-width: 768px) {
        input, textarea {
          font-size: 16px !important;
        }

        /* Adjust visual font sizes for mobile while keeping actual font-size at 16px */
        .mobile-text-sm input, .mobile-text-sm textarea {
          font-size: 16px !important;
          transform: scale(0.875); /* Visually smaller but technically 16px */
          transform-origin: left center;
        }

        .mobile-text-lg input, .mobile-text-lg textarea {
          font-size: 16px !important;
          font-weight: 600;
        }
      }
    </style>
