services:
  # ============================================================================
  # QA ENVIRONMENT (Auto-deploy on push to main)
  # ============================================================================

  # QA Backend API Service
  - type: web
    name: meal-planner-api-qa
    env: python
    branch: master
    buildCommand: "cd backend && uv sync"
    startCommand: "cd backend && uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: true  # Auto-deploy on push
    envVars:
      - key: ENVIRONMENT
        value: qa
      - key: SUPABASE_URL
        sync: false  # SECRET - Set in Render dashboard to QA Supabase URL
      - key: DATABASE_URL
        sync: false  # SECRET - Set in Render dashboard to QA Supabase pooler connection
      - key: SQL_DEBUG
        value: true  # Enable debug logging in QA
      - key: GEMINI_API_KEY
        sync: false  # SECRET - Set in Render dashboard

  # QA Frontend Static Site
  - type: static
    name: meal-planner-frontend-qa
    branch: master
    buildCommand: "npm install && npm run build"
    publishPath: "./dist"
    autoDeploy: true  # Auto-deploy on push
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ENVIRONMENT
        value: qa
      - key: VITE_SUPABASE_URL
        sync: false  # SECRET - Set in Render dashboard to QA Supabase URL
      - key: VITE_SUPABASE_ANON_KEY
        sync: false  # SECRET - Set in Render dashboard to QA Supabase anon key
      - key: VITE_API_BASE_URL
        sync: false  # SECRET - Set in Render dashboard to QA backend URL
      - key: VITE_GA_MEASUREMENT_ID
        value: G-X5HX141WYD
      - key: VITE_GA_DEBUG
        value: true  # Enable GA debug in QA
      - key: VITE_GA_TEST_MODE
        value: true  # Test mode in QA

  # ============================================================================
  # PRODUCTION ENVIRONMENT (Manual deploy only)
  # IMPORTANT: Using existing service names (meal-planner-*-v2)
  # ============================================================================

  # Production Backend API Service (existing service name preserved)
  - type: web
    name: meal-planner-api-v2
    env: python
    branch: master
    buildCommand: "cd backend && uv sync"
    startCommand: "cd backend && uv run uvicorn main:app --host 0.0.0.0 --port $PORT"
    autoDeploy: false  # MANUAL DEPLOY ONLY - Changed from auto to manual
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SUPABASE_URL
        sync: false  # SECRET - Already set in Render dashboard
      - key: DATABASE_URL
        sync: false  # SECRET - Already set in Render dashboard
      - key: SQL_DEBUG
        value: false  # Disable debug logging in production
      - key: GEMINI_API_KEY
        sync: false  # SECRET - Already set in Render dashboard

  # Production Frontend Static Site (existing service name preserved)
  - type: static
    name: meal-planner-frontend-v2
    branch: master
    buildCommand: "npm install && npm run build"
    publishPath: "./dist"
    autoDeploy: false  # MANUAL DEPLOY ONLY - Changed from auto to manual
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ENVIRONMENT
        value: production
      - key: VITE_SUPABASE_URL
        sync: false  # SECRET - Already set in Render dashboard
      - key: VITE_SUPABASE_ANON_KEY
        sync: false  # SECRET - Already set in Render dashboard
      - key: VITE_API_BASE_URL
        sync: false  # SECRET - Already set in Render dashboard
      - key: VITE_GA_MEASUREMENT_ID
        value: G-X5HX141WYD
      - key: VITE_GA_DEBUG
        value: false  # Disable GA debug in production
      - key: VITE_GA_TEST_MODE
        value: false  # Live mode in production
